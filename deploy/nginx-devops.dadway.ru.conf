server {
    listen 80;
    listen [::]:80;
    server_name devops.dadway.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host:8090$request_uri;
    }
}

server {
    listen 8090 ssl;
    listen [::]:8090 ssl;
    server_name devops.dadway.ru;

    ssl_certificate /etc/letsencrypt/live/devops.dadway.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops.dadway.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not trust a client-supplied X-Forwarded-For value. DockPilot uses
        # the first address for login rate limiting when proxy trust is enabled.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
