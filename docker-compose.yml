services:
  dockpilot:
    build: .
    container_name: dockpilot
    restart: unless-stopped
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    environment:
      PANEL_USER: "${PANEL_USER:-admin}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:?Set PANEL_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      LOGIN_MAX_ATTEMPTS: "${LOGIN_MAX_ATTEMPTS:-5}"
      LOGIN_WINDOW_SECONDS: "${LOGIN_WINDOW_SECONDS:-300}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      BACKUP_DIR: "/backups"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockpilot_data:/app/data
      - dockpilot_backups:/backups
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - dockpilot_internal

volumes:
  dockpilot_data:
  dockpilot_backups:

networks:
  dockpilot_internal:
    driver: bridge
